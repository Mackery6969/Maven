name: publish

# Reusable: uploads a staged Maven tree to the R2 bucket behind maven.mackery.com.
#
# Callers stage their tree with `./gradlew publish`, upload it with
# actions/upload-artifact, then call this with that artifact's name. Coordinates
# are read from the tree itself, so there is nothing for a caller to get wrong.

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the uploaded artifact holding the Maven tree"
        required: true
        type: string
      bucket:
        description: "R2 bucket name"
        required: false
        default: maven
        type: string
      base_url:
        description: "Public URL of the repository, used to read current metadata"
        required: false
        default: https://maven.mackery.com
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUCKET: ${{ inputs.bucket }}
      BASE_URL: ${{ inputs.base_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Download the staged Maven tree
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact }}
          path: staging

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Upload artifacts
        working-directory: staging
        run: |
          set -euo pipefail
          # Everything except maven-metadata.xml: that file lists only the versions
          # present in this staging tree, so uploading it as-is would drop every
          # previously published version. It is rebuilt from the live copy below.
          find . -type f ! -name 'maven-metadata.xml*' | sed 's|^\./||' | while read -r key; do
            echo "put $key"
            wrangler r2 object put "$BUCKET/$key" --file "$key" --remote
          done

      - name: Refresh maven-metadata.xml
        working-directory: staging
        run: |
          set -euo pipefail

          # One staged tree may carry several artifacts; each has its own metadata.
          find . -name maven-metadata.xml | sed 's|^\./||' | while read -r staged; do
            group_path=$(dirname "$staged")
            echo "::group::$group_path"

            # The live copy is the source of truth for what has been published;
            # a miss just means this is the artifact's first publish.
            curl -fsSL "$BASE_URL/$group_path/maven-metadata.xml" -o live.xml || : > live.xml

            STAGED="$staged" LIVE=live.xml OUT=merged.xml python3 - <<'PY'
          import os, re, datetime, pathlib

          staged = pathlib.Path(os.environ["STAGED"]).read_text()
          live_path = pathlib.Path(os.environ["LIVE"])
          live = live_path.read_text() if live_path.stat().st_size else ""

          def field(name, text):
              m = re.search(rf"<{name}>([^<]+)</{name}>", text)
              return m.group(1) if m else ""

          group_id = field("groupId", staged)
          artifact_id = field("artifactId", staged)

          versions = set(re.findall(r"<version>([^<]+)</version>", live))
          versions |= set(re.findall(r"<version>([^<]+)</version>", staged))

          def sort_key(v):
              return [int(p) if p.isdigit() else p for p in re.split(r"[.\-+]", v)]

          ordered = sorted(versions, key=sort_key)
          latest = ordered[-1]
          items = "\n".join(f"      <version>{v}</version>" for v in ordered)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M%S")

          pathlib.Path(os.environ["OUT"]).write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              "<metadata>\n"
              f"  <groupId>{group_id}</groupId>\n"
              f"  <artifactId>{artifact_id}</artifactId>\n"
              "  <versioning>\n"
              f"    <latest>{latest}</latest>\n"
              f"    <release>{latest}</release>\n"
              "    <versions>\n"
              f"{items}\n"
              "    </versions>\n"
              f"    <lastUpdated>{stamp}</lastUpdated>\n"
              "  </versioning>\n"
              "</metadata>\n"
          )
          print(f"{group_id}:{artifact_id} -> {', '.join(ordered)}")
          PY

            wrangler r2 object put "$BUCKET/$group_path/maven-metadata.xml" \
              --file merged.xml --content-type application/xml --remote

            # Checksums must match the merged file, not the staged one.
            for algo in md5 sha1 sha256 sha512; do
              "${algo}sum" merged.xml | cut -d' ' -f1 > "merged.$algo"
              wrangler r2 object put "$BUCKET/$group_path/maven-metadata.xml.$algo" \
                --file "merged.$algo" --content-type text/plain --remote
            done

            rm -f live.xml merged.xml merged.md5 merged.sha1 merged.sha256 merged.sha512
            echo "::endgroup::"
          done
